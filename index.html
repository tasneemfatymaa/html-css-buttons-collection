<Style>
  .subscribe-button {
    background-color: rgb(192, 17, 17);
    color: white;
    border: none;
    height: 36px;
    width: 100px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: opacity 1s;
  }

  .subscribe-button:hover {
    opacity: 0.3;
  }

  .join-button:hover {
    background-color: rgb(8, 137, 241);
    color: white;
    transition: background-color 1s;
    color: 0.1s;
  }

  .join-button:active {
    opacity: 0.6;
  }


  .subscribe-button:active {
    opacity: 0.1;
  }


  .join-button {
    background-color: white;
    border-color: rgb(8, 137, 241);
    border-style: solid;
    border-width: 1px;
    color: rgb(8, 137, 241);
    height: 36px;
    width: 63px;
    border-radius: 2px;
    cursor: pointer;
  }

  .tweet-button {
    background-color: rgb(94, 94, 245);
    color: rgb(248, 249, 250);
    height: 36px;
    width: 70px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    border: none;
    margin-left: 8px;
    transition: 1s;
  }

  .tweet-button:hover {
    box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.15)
  }

  .request-button {
    background-color: rgb(0, 0, 0);
    color: white;
    height: 36px;
    width: 100px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
    border: none;
    margin-left: 8px;
    transition: 0.15s;
  }

  .request-button:hover {
    opacity: 0.4;
  }

  .add-button {
    background-color: rgb(253, 250, 56);
    color: rgb(0, 0, 0);
    height: 36px;
    width: 180px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: 0.15s;
    margin-right: 8px;
  }

  .add-button:hover {
    background-color: rgb(246, 250, 5);
    transition: background-color 0.15s;

  }

  .sign-up-button {
    background-color: rgb(20, 241, 31);
    color: white;
    height: 36px;
    width: 100px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    font-size: 15px;
    font-weight: bold;
    margin-right: 6px;
  }

  .sign-up-button:hover {
    box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.15);
  }

  .get-started-button {
    background-color: rgb(134, 6, 173);
    color: white;
    height: 36px;
    width: 100px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    font-weight: bold;
    font-size: 15px;
    transition: all 0.15s;
  }

  .get-started-button:hover {
    background-color: rgb(253, 228, 228);
    transition: background-color 0.15s;
    color: rgb(134, 6, 173);
  }

  .download-button {
    background-color: rgb(255, 255, 255);
    color: rgb(88, 86, 86s);
    height: 36px;
    width: 100px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    font-weight: bold;
    font-size: 15px;
    border: 1px solid rgb(88, 86, 86);
    margin-right: 8px;
  }

  .download-button:hover {
    background-color: rgb(88, 86, 86);
    color: white;
    transition: all 0.15s;
  }

  .apply-button {
    background-color: rgb(56, 119, 190);
    color: white;
    height: 40px;
    width: 280px;
    border-radius: 18px;
    cursor: pointer;
    border: none;
    font-weight: bold;
    font-size: 15px;
    margin-right: 8px;
    margin-top: 18px;
  }

  .apply-button:hover {
    background-color: rgb(255, 254, 254);
    transition: all 0.15s;
    color: rgb(56, 119, 190);
    border: solid rgb(56, 119, 190);
  }

  .save-button {
    background-color: rgb(255, 255, 255);
    color: rgb(56, 119, 190);
    height: 36px;
    width: 90px;
    border-radius: 18px;
    cursor: pointer;
    border: none;
    font-weight: bold;
    font-size: 15px;
    border: 1px solid rgb(56, 119, 190);
  }

  .save-button:hover {
    background-color: rgb(56, 119, 190);
    color: white;
    transition: all 0.15s;
  }
</Style>



<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button
">JOIN
</button>

<button class="tweet-button">
  Tweet
</button>

  Request Now
</button>

<button class="add-button">
  Add to cart
</button>

<button class="sign-up-button">
  SIGN UP
</button>

<button class="get-started-button">
  Get started
</button>

  download
</button>

  Apply on company website
</button>
